<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Gift box -->
  <rect x="20" y="28" width="24" height="16" fill="#28a745" stroke="#1e7e34" stroke-width="1"/>
  
  <!-- Gift box lid -->
  <rect x="18" y="26" width="28" height="4" fill="#20c997" stroke="#1e7e34" stroke-width="1"/>
  
  <!-- Ribbon vertical -->
  <rect x="30" y="26" width="2" height="18" fill="#dc3545" stroke="#c82333" stroke-width="0.5"/>
  
  <!-- Ribbon horizontal -->
  <rect x="20" y="32" width="24" height="2" fill="#dc3545" stroke="#c82333" stroke-width="0.5"/>
  
  <!-- Ribbon bow left -->
  <path d="M 28 26 Q 26 24 24 26 Q 26 28 28 26" fill="#dc3545" stroke="#c82333" stroke-width="0.5"/>
  
  <!-- Ribbon bow right -->
  <path d="M 36 26 Q 38 24 40 26 Q 38 28 36 26" fill="#dc3545" stroke="#c82333" stroke-width="0.5"/>
  
  <!-- Heart -->
  <path d="M 32 18 Q 32 16 30 16 Q 28 16 28 18 Q 28 20 30 22 Q 32 24 32 24 Q 32 24 34 22 Q 36 20 36 18 Q 36 16 34 16 Q 32 16 32 18" 
        fill="#e83e8c" stroke="#d63384" stroke-width="0.5"/>
  
  <!-- Sparkle effects -->
  <circle cx="24" cy="20" r="1" fill="#ffc107"/>
  <circle cx="40" cy="20" r="1" fill="#ffc107"/>
  <circle cx="32" cy="44" r="1" fill="#ffc107"/>
</svg>
