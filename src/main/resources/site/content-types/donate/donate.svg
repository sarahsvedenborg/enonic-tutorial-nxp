<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar background -->
  <rect x="8" y="12" width="48" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="2"/>
  
  <!-- Calendar header -->
  <rect x="8" y="12" width="48" height="12" fill="#000000" stroke="#000000" stroke-width="1.5" rx="2 2 0 0"/>
  
  <!-- Calendar binding rings -->
  <circle cx="18" cy="18" r="1.5" fill="#ffffff"/>
  <circle cx="46" cy="18" r="1.5" fill="#ffffff"/>
  
  <!-- Calendar grid lines -->
  <line x1="8" y1="24" x2="56" y2="24" stroke="#000000" stroke-width="0.5"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#000000" stroke-width="0.5"/>
  <line x1="8" y1="40" x2="56" y2="40" stroke="#000000" stroke-width="0.5"/>
  <line x1="8" y1="48" x2="56" y2="48" stroke="#000000" stroke-width="0.5"/>
  
  <!-- Vertical grid lines -->
  <line x1="16" y1="24" x2="16" y2="56" stroke="#000000" stroke-width="0.5"/>
  <line x1="24" y1="24" x2="24" y2="56" stroke="#000000" stroke-width="0.5"/>
  <line x1="32" y1="24" x2="32" y2="56" stroke="#000000" stroke-width="0.5"/>
  <line x1="40" y1="24" x2="40" y2="56" stroke="#000000" stroke-width="0.5"/>
  <line x1="48" y1="24" x2="48" y2="56" stroke="#000000" stroke-width="0.5"/>
  
  <!-- Dollar sign circle at bottom right -->
  <circle cx="52" cy="52" r="8" fill="#000000" stroke="#000000" stroke-width="1"/>
  <text x="52" y="57" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
</svg>
